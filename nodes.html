<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nodes · Resource Archive</title>
  <link rel="stylesheet" href="/css/archive.css?v=20260723-node-full-view">
  <link rel="stylesheet" href="/css/motion.css">
  <link rel="stylesheet" href="/css/nodes.css">
  <link rel="stylesheet" href="/css/node-wordmark.css">
  <script>
    (() => {
      const lifecycle = window.__resourceArchiveNodeTransitionLifecycle = {
        pending: false,
        settled: false,
      };
      addEventListener('pagereveal', event => {
        if (!event.viewTransition) {
          lifecycle.settled = true;
          return;
        }
        lifecycle.pending = true;
        const settle = () => {
          lifecycle.pending = false;
          lifecycle.settled = true;
          dispatchEvent(new Event('resource-archive-node-transition-settled'));
        };
        event.viewTransition.finished.then(settle, settle);
      }, { once: true });
    })();
  </script>
</head>
<body data-page="nodes">
  <a class="skip-link" href="#main-content" data-i18n="skip-to-content">Skip to content</a>
  <canvas class="global-pixel-field" data-testid="global-pixel-field" aria-hidden="true"></canvas>
  <header class="site-header">
    <div class="nav-shell">
      <a class="brand" href="/index.html">Resource Archive</a>
      <nav class="primary-nav" aria-label="Primary">
        <a href="/index.html">Home</a><a href="/index.html#nodes" aria-current="page">Nodes</a><a href="/stages.html">Stages</a><a href="/tutorials.html">Tutorials</a><a href="/plugins.html">Plugins</a><a href="/contributors.html">Contributors</a>
      </nav>
    </div>
  </header>
  <main id="main-content" class="page-shell node-catalog-page" data-main-content>
    <div id="node-catalog-app" aria-live="polite">
      <header class="catalog-header" data-transition-catalog-header>
        <a class="node-parent-link" data-transition-catalog-parent data-node-parent-link href="/index.html#nodes">Node systems directory</a>
        <p class="eyebrow" data-transition-catalog-kicker>Node systems</p>
        <h1 class="catalog-title" data-transition-catalog-title style="view-transition-name: node-system-title">Geometry Nodes</h1>
        <p class="catalog-summary" data-transition-catalog-summary>Every source record is present as a lightweight link. Details load only when opened.</p>
        <strong class="catalog-total" data-transition-catalog-count aria-label="Node count" style="view-transition-name: node-system-count"></strong>
        <canvas class="node-wordmark-canvas catalog-wordmark-canvas" data-transition-catalog-wordmark aria-hidden="true" width="480" height="80" style="view-transition-name: node-system-wordmark"></canvas>
        <p class="node-wordmark-text catalog-wordmark-text" data-transition-catalog-wordmark-fallback>Geometry Nodes</p>
      </header>
      <div class="loading node-catalog-skeleton" role="status" aria-label="Loading node archive" data-i18n-aria-label="nodes-loading-archive-label">
        <p data-i18n="nodes-loading-archive">Loading node archive…</p>
        <div aria-hidden="true"></div>
      </div>
    </div>
  </main>
  <footer class="site-footer"><a class="footer-link" href="/index.html" data-i18n="footer-home">Resource Archive home</a><div class="footer-marquee-safe" aria-hidden="true"></div></footer>

</body>
</html>
